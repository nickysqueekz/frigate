name: Build and Push Frigate to GHCR

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: frigate

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Show environment info
        run: |
          uname -a
          cat /etc/os-release

      - name: Confirm Dockerfile is present
        run: |
          echo "== Checking for Dockerfile =="
          test -f docker/frigate-coral-x64.Dockerfile && echo "Dockerfile found ✅" || (echo "❌ Dockerfile missing!" && exit 1)

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short commit SHA
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" | tee -a $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frigate-coral-x64.Dockerfile
          platforms: linux/amd64
          push: true
          no-cache: true
          provenance: false
          sbom: false
          build-args:
            - PROGRESS=plain
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ env.IMAGE_NAME }}:0.16-dev
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ env.IMAGE_NAME }}:0.16-dev-${{ env.COMMIT_SHA }}
            ghcr.io/${{ secrets.GHCR_USERNAME }}/${{ env.IMAGE_NAME }}:latest
